<!doctype html>
<html lang="id">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Seminar Check-in</title>


  <!-- ZXing QR Scanner -->
  <script type="module">

    import {
      BrowserMultiFormatReader
    } from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";


    /*
     * ==================================================
     * CONFIGURATION
     * ==================================================
     */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbynFvk-D1N4EUKLCMZvlapcdn5ETdrkr1FldK_Q-9eRhzFUBDnMhhwrz7uey1S_LQSpg/exec';


    /*
     * ==================================================
     * GLOBAL
     * ==================================================
     */

    let reader = null;

    let controls = null;

    let scanning = false;

    let processing = false;


    /*
     * ==================================================
     * UI
     * ==================================================
     */

    window.setResult = function(text, type) {

      const el =
        document.getElementById('result');

      el.textContent = text;

      el.className = type || '';

    };


    /*
     * ==================================================
     * START CAMERA
     * ==================================================
     */
window.startCamera = async function() {

  if (scanning) {
    return;
  }

  try {

    setResult(
      'Memulai kamera...',
      ''
    );


    reader =
      new BrowserMultiFormatReader();


    const devices =
      await BrowserMultiFormatReader
        .listVideoInputDevices();


    console.log(
      'CAMERA DEVICES:',
      devices
    );


    if (!devices || devices.length === 0) {
      throw new Error(
        'Tidak ada kamera yang ditemukan.'
      );
    }


    let camera =
      devices.find(function(device) {

        return /back|rear|environment/i
          .test(device.label);

      });


    if (!camera) {
      camera =
        devices[devices.length - 1];
    }


    console.log(
      'CAMERA YANG DIPILIH:',
      camera
    );


    setResult(
      'KAMERA AKTIF\n\n' +
      (camera.label || 'Kamera belakang') +
      '\n\n' +
      'Arahkan kamera ke QR peserta.',
      'success'
    );


    controls =
      await reader.decodeFromVideoDevice(

        camera.deviceId,

        'video',

        function(scanResult, error) {

          /*
           * Jangan lakukan apa-apa kalau
           * QR belum terbaca.
           */

          if (!scanResult) {
            return;
          }


          const text =
            scanResult.getText();


          console.log(
            'QR BERHASIL DIBACA:',
            text
          );


          /*
           * Tampilkan dulu hasil mentah.
           * Ini penting untuk memastikan
           * kamera benar-benar membaca QR.
           */

          setResult(
            'QR TERBACA!\n\n' +
            text,
            'success'
          );


          /*
           * Setelah terbukti terbaca,
           * baru proses check-in.
           */

          if (processing) {
            return;
          }


          processing = true;


          processQr(text);

        }

      );


    scanning = true;


    document
      .getElementById('startBtn')
      .disabled = true;


    document
      .getElementById('stopBtn')
      .disabled = false;


  } catch (error) {

    console.error(error);


    setResult(

      'KAMERA GAGAL DIJALANKAN\n\n' +

      'Name: ' +
      (error.name || 'unknown') +

      '\n\nMessage: ' +

      (error.message || error),

      'error'

    );


    reader = null;
    controls = null;
    scanning = false;
    processing = false;


    document
      .getElementById('startBtn')
      .disabled = false;


    document
      .getElementById('stopBtn')
      .disabled = true;

  }

};
    


    /*
     * ==================================================
     * STOP CAMERA
     * ==================================================
     */

    window.stopCamera = async function() {

      try {

        if (controls) {
          controls.stop();
        }

      } catch (error) {

        console.error(error);

      }


      try {

        if (reader) {
          reader.reset();
        }

      } catch (error) {

        console.error(error);

      }


      controls = null;
      reader = null;

      scanning = false;
      processing = false;


      document
        .getElementById('startBtn')
        .disabled = false;


      document
        .getElementById('stopBtn')
        .disabled = true;


      setResult(
        'Kamera dihentikan.',
        ''
      );

    };


    /*
     * ==================================================
     * PROCESS QR
     * ==================================================
     */

    function processQr(text) {

      console.log(
        'QR CONTENT:',
        text
      );


      let reg = '';


      /*
       * QR kita berisi JSON:
       *
       * {
       *   reg: "REG-00009",
       *   nama: "...",
       *   hp: "...",
       *   event: "..."
       * }
       */

      try {

        const obj =
          JSON.parse(text);


        if (obj.reg) {

          reg =
            String(obj.reg)
              .trim()
              .toUpperCase();

        }

      } catch (e) {

        /*
         * Kalau QR bukan JSON,
         * anggap seluruh isi QR
         * sebagai nomor registrasi.
         */

        reg =
          String(text)
            .trim()
            .toUpperCase();

      }


      if (!reg) {

        setResult(
          'QR tidak berisi nomor registrasi.',
          'error'
        );


        processing = false;

        return;

      }


      console.log(
        'REGISTRASI:',
        reg
      );


      sendCheckIn(reg);

    }


    /*
     * ==================================================
     * SEND CHECK-IN
     * ==================================================
     */

    async function sendCheckIn(reg) {

      const officer =
        document
          .getElementById('officer')
          .value
          .trim() ||
        'Panitia';


      setResult(

        'MEMPROSES CHECK-IN...\n\n' +

        'Registrasi: ' +
        reg +

        '\n' +

        'Petugas: ' +
        officer,

        ''

      );


      try {

        console.log(
          'Mengirim ke API:',
          API_URL
        );


        const response =
          await fetch(

            API_URL,

            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain;charset=utf-8'
              },

              body:
                JSON.stringify({

                  action: 'checkin',

                  reg: reg,

                  officer: officer

                })

            }

          );


        const text =
          await response.text();


        console.log(
          'API RESPONSE:',
          text
        );


        let data = null;


        try {

          data =
            JSON.parse(text);

        } catch (e) {

          data = null;

        }


        /*
         * Jika Apps Script mengembalikan
         * response yang tidak bisa dibaca
         * sebagai JSON.
         */

        if (!data) {

          setResult(

            'CHECK-IN TERKIRIM\n\n' +

            'Registrasi: ' +
            reg +

            '\n\n' +

            'Server tidak mengembalikan JSON.',

            ''

          );


          return;

        }


        /*
         * CHECK-IN BERHASIL
         */

        if (data.ok) {


          if (data.already) {

            setResult(

              'SUDAH CHECK-IN\n\n' +

              'Registrasi: ' +
              data.reg +

              '\n' +

              'Nama: ' +
              data.nama +

              '\n\n' +

              'Peserta ini sebelumnya sudah tercatat Hadir.',

              ''

            );


          } else {

            setResult(

              'CHECK-IN BERHASIL\n\n' +

              'Registrasi: ' +
              data.reg +

              '\n' +

              'Nama: ' +
              data.nama +

              '\n\n' +

              'Status peserta sekarang: HADIR',

              'success'

            );

          }


        } else {


          setResult(

            'CHECK-IN GAGAL\n\n' +

            (
              data.error ||
              'Error tidak diketahui.'
            ),

            'error'

          );

        }


      } catch (error) {

        console.error(
          'API ERROR:',
          error
        );


        setResult(

          'GAGAL TERHUBUNG KE SERVER\n\n' +

          'Error: ' +
          (error.name || 'Unknown') +

          '\n\n' +

          (
            error.message ||
            error
          ),

          'error'

        );

      }


      /*
       * Beri jeda 2,5 detik supaya QR
       * yang sama tidak langsung dikirim
       * berulang kali.
       */

      setTimeout(

        function() {

          processing = false;

        },

        2500

      );

    }


    /*
     * ==================================================
     * FILE QR
     * ==================================================
     */

    window.scanFile = function() {

      document
        .getElementById('qrFile')
        .click();

    };


    window.processFile = async function(input) {

      const file =
        input.files[0];


      if (!file) {
        return;
      }


      setResult(
        'Membaca QR dari file...',
        ''
      );


      try {

        const fileReader =
          new BrowserMultiFormatReader();


        const imageUrl =
          URL.createObjectURL(file);


        const result =
          await fileReader.decodeFromImageUrl(
            imageUrl
          );


        URL.revokeObjectURL(
          imageUrl
        );


        const text =
          result.getText();


        console.log(
          'QR FILE TERBACA:',
          text
        );


        if (!processing) {

          processing = true;

          processQr(text);

        }


      } catch (error) {

        console.error(
          'FILE QR ERROR:',
          error
        );


        setResult(

          'QR tidak dapat dibaca dari file.\n\n' +

          (
            error.message ||
            'Format QR tidak dikenali.'
          ),

          'error'

        );


        processing = false;

      }


      input.value = '';

    };

  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      font-family: Arial, sans-serif;

      margin: 0;

      background: #f5f5f5;

      color: #222;

    }


    .container {

      max-width: 520px;

      margin: auto;

      padding: 18px;

    }


    h2 {

      text-align: center;

      margin-top: 5px;

    }


    label {

      display: block;

      margin-top: 15px;

      font-weight: bold;

    }


    input,
    button {

      width: 100%;

      padding: 13px;

      margin-top: 7px;

      font-size: 16px;

      border-radius: 6px;

      border: 1px solid #bbb;

    }


    button {

      cursor: pointer;

      background: white;

    }


    button:disabled {

      opacity: .5;

      cursor: not-allowed;

    }


    #reader {

      width: 100%;

      margin-top: 18px;

      background: #111;

      border-radius: 8px;

      overflow: hidden;

    }


    #video {

      width: 100%;

      display: block;

      background: #111;

      border-radius: 8px;

    }


    #result {

      margin-top: 18px;

      padding: 16px;

      background: white;

      border-radius: 8px;

      min-height: 90px;

      white-space: pre-wrap;

    }


    .success {

      font-weight: bold;

    }


    .error {

      font-weight: bold;

    }


    .small {

      margin-top: 12px;

      font-size: 13px;

      color: #666;

    }

  </style>

</head>


<body>

  <div class="container">

    <h2>
      Seminar Check-in
    </h2>


    <label for="officer">
      Nama Panitia
    </label>


    <input
      id="officer"
      type="text"
      placeholder="Masukkan nama panitia"
    >


    <button
      id="startBtn"
      onclick="startCamera()"
    >
      📷 MULAI KAMERA
    </button>


    <button
      id="stopBtn"
      onclick="stopCamera()"
      disabled
    >
      ⛔ STOP KAMERA
    </button>


    <div id="reader">

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>

    </div>


    <button
      onclick="scanFile()"
    >
      📁 SCAN FILE QR
    </button>


    <input
      id="qrFile"
      type="file"
      accept="image/*"
      style="display:none"
      onchange="processFile(this)"
    >


    <div id="result">
      Siap melakukan scan.
    </div>


    <div class="small">

      Gunakan kamera belakang HP untuk
      memindai QR peserta.

    </div>

  </div>

</body>

</html>
