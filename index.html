<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Seminar Check-in</title>


  <!-- ==================================================
       ZXing
       ================================================== -->

  <script type="module">

    import {
      BrowserMultiFormatReader
    } from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";


    /*
     * ==================================================
     * API
     * ==================================================
     */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbynFvk-D1N4EUKLCMZvlapcdn5ETdrkr1FldK_Q-9eRhzFUBDnMhhwrz7uey1S_LQSpg/exec';


    /*
     * ==================================================
     * GLOBAL
     * ==================================================
     */

    let reader = null;

    let controls = null;

    let processing = false;


    /*
     * ==================================================
     * START CAMERA
     * ==================================================
     */

    window.startCamera = async function () {

      const result =
        document.getElementById("result");


      try {

        result.textContent =
          "Memulai kamera...";


        /*
         * INI SENGAJA SAMA DENGAN
         * zxing-test.html YANG SUDAH BERHASIL.
         */

        reader =
          new BrowserMultiFormatReader();


        const devices =
          await BrowserMultiFormatReader
            .listVideoInputDevices();


        console.log(
          "CAMERA DEVICES:",
          devices
        );


        if (
          !devices ||
          devices.length === 0
        ) {

          throw new Error(
            "Tidak ada kamera ditemukan."
          );

        }


        /*
         * Cari kamera belakang.
         */

        let camera =
          devices.find(function (device) {

            return /back|rear|environment/i
              .test(device.label);

          });


        /*
         * Jika tidak ditemukan,
         * gunakan kamera terakhir.
         */

        if (!camera) {

          camera =
            devices[devices.length - 1];

        }


        console.log(
          "CAMERA YANG DIPILIH:",
          camera
        );


        result.textContent =

          "KAMERA AKTIF\n\n" +

          camera.label +

          "\n\n" +

          "Arahkan kamera ke QR peserta.";


        /*
         * INI JUGA SENGAJA SAMA DENGAN
         * zxing-test.html.
         */

        controls =
          await reader.decodeFromVideoDevice(

            camera.deviceId,

            "video",

            function (scanResult, error) {

              if (scanResult) {

                const text =
                  scanResult.getText();


                console.log(
                  "QR BERHASIL:",
                  text
                );


                /*
                 * Tampilkan dulu isi QR.
                 */

                result.textContent =

                  "QR TERBACA!\n\n" +

                  text;


                /*
                 * Jangan kirim QR berulang-ulang.
                 */

                if (processing) {
                  return;
                }


                processing = true;


                /*
                 * Proses nomor registrasi.
                 */

                processQr(text);

              }

            }

          );


        document
          .getElementById("startBtn")
          .disabled = true;


        document
          .getElementById("stopBtn")
          .disabled = false;


      } catch (error) {

        console.error(error);


        result.textContent =

          "GAGAL\n\n" +

          "Name: " +

          (
            error.name ||
            "unknown"
          ) +

          "\n\nMessage: " +

          (
            error.message ||
            error
          );


        reader = null;

        controls = null;

        processing = false;


        document
          .getElementById("startBtn")
          .disabled = false;


        document
          .getElementById("stopBtn")
          .disabled = true;

      }

    };


    /*
     * ==================================================
     * STOP CAMERA
     * ==================================================
     */

    window.stopCamera = function () {

      try {

        if (controls) {

          controls.stop();

          controls = null;

        }

      } catch (error) {

        console.error(error);

      }


      try {

        if (reader) {

          reader.reset();

          reader = null;

        }

      } catch (error) {

        console.error(error);

      }


      processing = false;


      document
        .getElementById("startBtn")
        .disabled = false;


      document
        .getElementById("stopBtn")
        .disabled = true;


      document
        .getElementById("result")
        .textContent =
          "Scanner dihentikan.";

    };


    /*
     * ==================================================
     * PROCESS QR
     * ==================================================
     */

    function processQr(text) {

      console.log(
        "ISI QR:",
        text
      );


      let reg = "";


      /*
       * QR dari sistem kita berbentuk JSON.
       */

      try {

        const obj =
          JSON.parse(text);


        if (obj.reg) {

          reg =
            String(obj.reg)
              .trim()
              .toUpperCase();

        }

      } catch (error) {

        /*
         * Kalau QR hanya berisi
         * REG-xxxxx langsung.
         */

        reg =
          String(text)
            .trim()
            .toUpperCase();

      }


      console.log(
        "NOMOR REGISTRASI:",
        reg
      );


      if (!reg) {

        document
          .getElementById("result")
          .textContent =

            "QR TERBACA,\n" +
            "tetapi nomor registrasi tidak ditemukan.";


        processing = false;

        return;

      }


      /*
       * Kirim ke API.
       */

      sendCheckIn(reg);

    }


    /*
     * ==================================================
     * SEND CHECK-IN
     * ==================================================
     */

    async function sendCheckIn(reg) {

      const officer =
        document
          .getElementById("officer")
          .value
          .trim() ||
        "Panitia";


      const result =
        document.getElementById("result");


      result.textContent =

        "QR TERBACA!\n\n" +

        "Registrasi: " +
        reg +

        "\n\n" +

        "Mengirim ke server...";


      try {

        console.log(
          "KIRIM API:",
          {
            action: "checkin",
            reg: reg,
            officer: officer
          }
        );


        const response =
          await fetch(

            API_URL,

            {

              method: "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  action: "checkin",

                  reg: reg,

                  officer: officer

                })

            }

          );


        const text =
          await response.text();


        console.log(
          "RESPONSE API:",
          text
        );


        let data = null;


        try {

          data =
            JSON.parse(text);

        } catch (error) {

          console.error(
            "Response bukan JSON:",
            error
          );

        }


        /*
         * Jika server berhasil dipanggil
         * tetapi response JSON tidak terbaca.
         */

        if (!data) {

          result.textContent =

            "CHECK-IN TERKIRIM\n\n" +

            "Registrasi: " +
            reg +

            "\n\n" +

            "Silakan cek Sheet Peserta.";

          return;

        }


        /*
         * API mengatakan berhasil.
         */

        if (data.ok) {


          /*
           * Peserta sudah pernah hadir.
           */

          if (data.already) {

            result.textContent =

              "SUDAH CHECK-IN\n\n" +

              "Registrasi: " +
              data.reg +

              "\n" +

              "Nama: " +
              data.nama +

              "\n\n" +

              "Peserta sudah tercatat HADIR.";

          }


          /*
           * Check-in baru.
           */

          else {

            result.textContent =

              "CHECK-IN BERHASIL\n\n" +

              "Registrasi: " +
              data.reg +

              "\n" +

              "Nama: " +
              data.nama +

              "\n\n" +

              "STATUS: HADIR";

          }

        }


        /*
         * API mengatakan gagal.
         */

        else {

          result.textContent =

            "CHECK-IN GAGAL\n\n" +

            (
              data.error ||
              "Error tidak diketahui."
            );

        }


      } catch (error) {

        console.error(
          "API ERROR:",
          error
        );


        result.textContent =

          "QR BERHASIL DIBACA\n\n" +

          "Registrasi: " +
          reg +

          "\n\n" +

          "Tetapi gagal menghubungi API.\n\n" +

          (
            error.message ||
            error
          );

      }


      /*
       * Beri jeda supaya QR yang sama
       * tidak dikirim berkali-kali.
       */

      setTimeout(
        function () {

          processing = false;

        },
        3000
      );

    }


    /*
     * ==================================================
     * SCAN FILE
     * ==================================================
     *
     * Untuk sementara tombol ini kita matikan
     * dari alur utama karena fokus kita adalah
     * memastikan kamera + ZXing + API.
     */

    window.scanFile = function () {

      document
        .getElementById("qrFile")
        .click();

    };


    window.processFile = async function (input) {

      const file =
        input.files[0];


      if (!file) {
        return;
      }


      const result =
        document.getElementById("result");


      result.textContent =
        "Scan file QR belum kita aktifkan pada tahap ini.";


      input.value = "";

    };

  </script>


  <style>

    body {

      font-family: Arial, sans-serif;

      max-width: 600px;

      margin: 20px auto;

      padding: 15px;

      background: #f5f5f5;

    }


    h2 {

      text-align: center;

    }


    label {

      display: block;

      margin-top: 15px;

      font-weight: bold;

    }


    input,
    button {

      width: 100%;

      padding: 13px;

      margin-top: 7px;

      font-size: 16px;

      border-radius: 6px;

      border: 1px solid #bbb;

      box-sizing: border-box;

    }


    button {

      cursor: pointer;

      background: white;

    }


    button:disabled {

      opacity: .5;

    }


    #video {

      width: 100%;

      margin-top: 18px;

      background: black;

      border-radius: 8px;

    }


    #result {

      white-space: pre-wrap;

      margin-top: 18px;

      padding: 16px;

      background: white;

      border-radius: 8px;

      min-height: 100px;

    }

  </style>

</head>


<body>

  <h2>
    Seminar Check-in
  </h2>


  <label for="officer">
    Nama Panitia
  </label>


  <input
    id="officer"
    type="text"
    placeholder="Masukkan nama panitia"
  >


  <button
    id="startBtn"
    onclick="startCamera()"
  >
    📷 MULAI KAMERA
  </button>


  <button
    id="stopBtn"
    onclick="stopCamera()"
    disabled
  >
    ⛔ STOP KAMERA
  </button>


  <!--
    Video dibuat persis seperti
    zxing-test.html yang berhasil.
  -->

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>


  <button
    onclick="scanFile()"
  >
    📁 SCAN FILE QR
  </button>


  <input
    id="qrFile"
    type="file"
    accept="image/*"
    style="display:none"
    onchange="processFile(this)"
  >


  <div id="result">
    Siap melakukan scan.
  </div>


  <p>
    Gunakan kamera belakang HP untuk
    memindai QR peserta.
  </p>

</body>

</html>
