<!doctype html>
<html lang="id">


<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Seminar Check-in</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
const API_URL ='https://script.google.com/macros/s/AKfycbynFvk-D1N4EUKLCMZvlapcdn5ETdrkr1FldK_Q-9eRhzFUBDnMhhwrz7uey1S_LQSpg/exec';
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 18px;
    }

    h2 {
      text-align: center;
      margin-top: 5px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #bbb;
    }

    button {
      cursor: pointer;
      background: white;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin-top: 18px;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
    }

    #result {
      margin-top: 18px;
      padding: 16px;
      background: white;
      border-radius: 8px;
      min-height: 90px;
      white-space: pre-wrap;
    }

    .success {
      font-weight: bold;
    }

    .error {
      font-weight: bold;
    }

    .small {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
    }

  </style>

</head>


<body>

<div class="container">

  <h2>Seminar Check-in</h2>


  <label for="officer">
    Nama Panitia
  </label>

  <input
    id="officer"
    type="text"
    placeholder="Masukkan nama panitia"
  >


  <button
    id="startBtn"
    onclick="startCamera()"
  >
    📷 MULAI KAMERA
  </button>


  <button
    id="stopBtn"
    onclick="stopCamera()"
    disabled
  >
    ⛔ STOP KAMERA
  </button>


  <div id="reader"></div>


  <button
    onclick="scanFile()"
  >
    📁 SCAN FILE QR
  </button>


  <input
    id="qrFile"
    type="file"
    accept="image/*"
    style="display:none"
    onchange="processFile(this)"
  >


  <div id="result">
    Siap melakukan scan.
  </div>


  <div class="small">
    Gunakan kamera belakang HP untuk memindai QR peserta.
  </div>

</div>


<script>

/*
 * ==================================================
 * CONFIGURATION
 * ==================================================
 */

const API_URL =
  'GANTI_DENGAN_URL_EXEC_SEMINAR_CHECKIN_API';


/*
 * ==================================================
 * GLOBAL
 * ==================================================
 */

let scanner = null;

let scanning = false;

let processing = false;


/*
 * ==================================================
 * UI
 * ==================================================
 */

function setResult(text, type) {

  const el =
    document.getElementById('result');

  el.textContent = text;

  el.className =
    type || '';

}


/*
 * ==================================================
 * START CAMERA
 * ==================================================
 */
async function startCamera() {

  if (scanning) {
    return;
  }

  setResult(
    'Memulai pemeriksaan kamera...',
    ''
  );

  try {

    // ==========================================
    // 1. Pastikan HTTPS
    // ==========================================

    if (!window.isSecureContext) {

      throw new Error(
        'Halaman tidak berjalan dalam HTTPS.'
      );

    }


    // ==========================================
    // 2. Pastikan browser punya camera API
    // ==========================================

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Browser tidak menyediakan getUserMedia().'
      );

    }


    setResult(
      'Meminta izin kamera...',
      ''
    );


    // ==========================================
    // 3. Minta kamera belakang
    // ==========================================

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: 'environment'
          }
        },

        audio: false

      });


    console.log(
      'Camera permission OK'
    );


    // ==========================================
    // 4. Tampilkan informasi kamera
    // ==========================================

    const tracks =
      stream.getVideoTracks();

    console.log(
      'Video tracks:',
      tracks
    );


    if (tracks.length === 0) {

      throw new Error(
        'Browser memberikan stream tetapi tidak ada video track.'
      );

    }


    console.log(
      'Camera label:',
      tracks[0].label
    );


    // ==========================================
    // 5. Hentikan stream percobaan
    // ==========================================

    tracks.forEach(
      track => track.stop()
    );


    // ==========================================
    // 6. Buat Html5Qrcode
    // ==========================================

    scanner =
      new Html5Qrcode(
        'reader'
      );


    // ==========================================
    // 7. Jalankan scanner
    // ==========================================

    await scanner.start(

      {
        facingMode: {
          ideal: 'environment'
        }
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      onScanSuccess,

      onScanFailure

    );


    // ==========================================
    // 8. Berhasil
    // ==========================================

    scanning = true;


    document
      .getElementById('startBtn')
      .disabled = true;


    document
      .getElementById('stopBtn')
      .disabled = false;


    setResult(
      'KAMERA AKTIF\n\n' +
      'Arahkan kamera belakang ke QR peserta.',
      'success'
    );


  } catch (error) {

    console.error(
      'CAMERA ERROR:',
      error
    );


    // ==========================================
    // Diagnostik lengkap
    // ==========================================

    let errorName =
      'Tidak diketahui';

    let errorMessage =
      'Tidak diketahui';


    if (error) {

      if (error.name) {
        errorName =
          String(error.name);
      }

      if (error.message) {
        errorMessage =
          String(error.message);
      }

    }


    // Beberapa browser/library bisa
    // mengembalikan string langsung.

    if (
      typeof error === 'string'
    ) {

      errorMessage =
        error;

    }


    // ==========================================
    // Tampilkan diagnostik
    // ==========================================

    setResult(

      'KAMERA GAGAL DIJALANKAN\n\n' +

      'Secure Context: ' +
      window.isSecureContext +
      '\n\n' +

      'Hostname: ' +
      location.hostname +
      '\n\n' +

      'Protocol: ' +
      location.protocol +
      '\n\n' +

      'MediaDevices: ' +
      (!!navigator.mediaDevices) +
      '\n\n' +

      'getUserMedia: ' +
      (!!(
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
      )) +
      '\n\n' +

      'Error Name: ' +
      errorName +
      '\n\n' +

      'Error Message: ' +
      errorMessage,

      'error'

    );


    scanning = false;

    processing = false;


    document
      .getElementById('startBtn')
      .disabled = false;


    document
      .getElementById('stopBtn')
      .disabled = true;

  }

}




/*
 * ==================================================
 * STOP CAMERA
 * ==================================================
 */

async function stopCamera() {

  if (!scanner) {
    return;
  }


  try {

    await scanner.stop();

  } catch (error) {

    console.error(error);

  }


  try {

    scanner.clear();

  } catch (error) {

    console.error(error);

  }


  scanner = null;

  scanning = false;

  processing = false;


  document
    .getElementById('startBtn')
    .disabled = false;

  document
    .getElementById('stopBtn')
    .disabled = true;


  setResult(
    'Kamera dihentikan.',
    ''
  );

}


/*
 * ==================================================
 * QR SUCCESS
 * ==================================================
 */

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }


  processing = true;


  processQr(
    decodedText
  );

}


/*
 * ==================================================
 * QR FAILURE
 * ==================================================
 */

function onScanFailure(errorMessage) {

  /*
   * Tidak perlu menampilkan error.
   *
   * Scanner memang akan sering memanggil
   * callback ini ketika belum menemukan QR.
   */

}


/*
 * ==================================================
 * PROCESS QR
 * ==================================================
 */

function processQr(text) {

  let reg = '';

  try {

    const obj =
      JSON.parse(text);

    if (obj.reg) {
      reg =
        String(obj.reg)
          .trim()
          .toUpperCase();
    }

  } catch (e) {

    /*
     * Kalau QR bukan JSON,
     * anggap isi QR langsung nomor registrasi.
     */

    reg =
      String(text)
        .trim()
        .toUpperCase();

  }


  if (!reg) {

    setResult(
      'QR tidak berisi nomor registrasi.',
      'error'
    );

    processing = false;

    return;
  }


  sendCheckIn(
    reg
  );

}


/*
 * ==================================================
 * SEND CHECK-IN
 * ==================================================
 */

async function sendCheckIn(reg) {

  const officer =
    document
      .getElementById('officer')
      .value
      .trim() ||
    'Panitia';


  setResult(
    'Memproses...\n\n' +
    reg,
    ''
  );


  try {

    const response =
      await fetch(

        API_URL,

        {

          method: 'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'checkin',

              reg:
                reg,

              officer:
                officer

            })

        }

      );


    const text =
      await response.text();


    let data;

    try {

      data =
        JSON.parse(text);

    } catch (e) {

      data = null;

    }


    if (!data) {

      setResult(

        'CHECK-IN TERKIRIM\n\n' +
        'Registrasi: ' +
        reg +
        '\n\n' +
        'Server tidak mengembalikan JSON.',

        ''

      );

      return;
    }


    if (data.ok) {

      if (data.already) {

        setResult(

          'SUDAH CHECK-IN\n\n' +
          data.reg +
          '\n' +
          data.nama,

          ''

        );

      } else {

        setResult(

          'CHECK-IN BERHASIL\n\n' +
          data.reg +
          '\n' +
          data.nama,

          'success'

        );

      }


    } else {

      setResult(

        'CHECK-IN GAGAL\n\n' +
        (data.error || 'Error tidak diketahui.'),

        'error'

      );

    }


  } catch (error) {

    console.error(error);

    setResult(

      'GAGAL TERHUBUNG KE SERVER\n\n' +
      error.name +
      '\n' +
      error.message,

      'error'

    );

  }


  /*
   * Beri jeda supaya QR yang sama
   * tidak langsung diproses berulang.
   */

  setTimeout(
    () => {
      processing = false;
    },
    2500
  );

}


/*
 * ==================================================
 * FILE QR
 * ==================================================
 */

function scanFile() {

  document
    .getElementById('qrFile')
    .click();

}


async function processFile(input) {

  const file =
    input.files[0];

  if (!file) {
    return;
  }


  setResult(
    'Membaca QR dari file...',
    ''
  );


  const fileScanner =
    new Html5Qrcode(
      'reader'
    );


  try {

    const decoded =
      await fileScanner.scanFile(
        file,
        true
      );


    try {

      await fileScanner.clear();

    } catch (e) {}


    processQr(
      decoded
    );


  } catch (error) {

    try {

      await fileScanner.clear();

    } catch (e) {}


    setResult(
      'QR tidak dapat dibaca dari file.',
      'error'
    );

    processing = false;

  }


  input.value = '';

}

</script>

</body>

</html>
