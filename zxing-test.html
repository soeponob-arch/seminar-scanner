<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Camera Test</title>

  <script type="module">
    import { BrowserMultiFormatReader }
      from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";

    window.startCameraTest = async function () {

      const result = document.getElementById("result");

      try {

        result.textContent = "Memulai kamera...";

        const reader = new BrowserMultiFormatReader();

        const devices =
          await BrowserMultiFormatReader.listVideoInputDevices();

        console.log("CAMERA DEVICES:", devices);

        if (!devices || devices.length === 0) {
          throw new Error("Tidak ada kamera ditemukan.");
        }

        let camera = devices.find(function(device) {
          return /back|rear|environment/i.test(device.label);
        });

        if (!camera) {
          camera = devices[devices.length - 1];
        }

        console.log("CAMERA YANG DIPILIH:", camera);

        result.textContent =
          "KAMERA AKTIF\n\n" +
          camera.label +
          "\n\n" +
          "Arahkan kamera ke QR.";

        window.controls =
          await reader.decodeFromVideoDevice(
            camera.deviceId,
            "video",
            function(scanResult, error) {

              if (scanResult) {

                const text = scanResult.getText();

                console.log("QR BERHASIL:", text);

                result.textContent =
                  "QR TERBACA!\n\n" + text;

                if (window.controls) {
                  window.controls.stop();
                }
              }

            }
          );

      } catch (error) {

        console.error(error);

        result.textContent =
          "GAGAL\n\n" +
          "Name: " +
          (error.name || "unknown") +
          "\n\nMessage: " +
          (error.message || error);

      }

    };


    window.stopCameraTest = function() {

      try {

        if (window.controls) {
          window.controls.stop();
          window.controls = null;
        }

        document.getElementById("result").textContent =
          "Scanner dihentikan.";

      } catch (error) {

        console.error(error);

      }

    };

  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
    }

    video {
      width: 100%;
      background: black;
      border-radius: 10px;
    }

    button {
      padding: 12px 18px;
      margin: 5px;
      font-size: 16px;
    }

    #result {
      white-space: pre-wrap;
      margin-top: 15px;
      padding: 15px;
      background: #eeeeee;
      border-radius: 8px;
    }

  </style>

</head>

<body>

  <h2>QR Camera Test</h2>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <br>

  <button onclick="startCameraTest()">
    MULAI KAMERA
  </button>

  <button onclick="stopCameraTest()">
    STOP
  </button>

  <div id="result">
    Siap melakukan test QR
  </div>

</body>
</html>
