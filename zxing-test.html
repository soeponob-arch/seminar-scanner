<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZXing QR Test</title>

  <script type="module">
    import {
      BrowserMultiFormatReader
    } from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";

    window.startZXing = async function () {
      const result = document.getElementById("result");

      try {
        result.textContent = "Memulai kamera...";

        const reader = new BrowserMultiFormatReader();

        const devices =
          await BrowserMultiFormatReader.listVideoInputDevices();

        console.log("Camera devices:", devices);

        if (!devices.length) {
          throw new Error("Tidak ada kamera yang ditemukan.");
        }

        // Pilih kamera belakang jika tersedia
        let camera = devices.find(d =>
          /back|rear|environment/i.test(d.label)
        );

        if (!camera) {
          camera = devices[devices.length - 1];
        }

        console.log("Selected camera:", camera);

        result.textContent =
          "Kamera aktif.\n\n" +
          camera.label +
          "\n\nArahkan kamera ke QR.";

        window.zxingControls =
          await reader.decodeFromVideoDevice(
            camera.deviceId,
            "video",
            (scanResult, error) => {

              if (scanResult) {
                const text = scanResult.getText();

                console.log("QR RESULT:", text);

                result.textContent =
                  "QR TERBACA!\n\n" + text;

                if (window.zxingControls) {
                  window.zxingControls.stop();
                }
              }
            }
          );

      } catch (error) {
        console.error(error);

        result.textContent =
          "GAGAL\n\n" +
          "Name: " + (error.name || "unknown") +
          "\n\nMessage: " +
          (error.message || error);
      }
    };

    window.stopZXing = function () {
      try {
        if (window.zxingControls) {
          window.zxingControls.stop();
          window.zxingControls = null;
        }

        document.getElementById("result").textContent =
          "Scanner dihentikan.";
      } catch (error) {
        console.error(error);
      }
    };
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
    }

    video {
      width: 100%;
      background: #000;
      border-radius: 10px;
    }

    button {
      padding: 12px 18px;
      margin: 5px;
      font-size: 16px;
    }

    #result {
      white-space: pre-wrap;
      margin-top: 15px;
      padding: 15px;
      background: #eee;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h2>ZXing QR Test</h2>

  <video id="video" autoplay muted playsinline></video>

  <br>

  <button onclick="startZXing()">
    Mulai Kamera
  </button>

  <button onclick="stopZXing()">
    Stop
  </button>

  <div id="result">
    Tekan "Mulai Kamera".
  </div>

</body>
</html>
